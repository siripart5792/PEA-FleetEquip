<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background PEA Royal Purple Gradient -->
    <linearGradient id="peaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="45%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Vibrant PEA Electric Gold Gradient -->
    <linearGradient id="peaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Inspection Pass Emerald Badge Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#peaBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- 2. PEA Gold Text Header -->
  <text x="32" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#fef08a" letter-spacing="1.5">PEA</text>

  <!-- 3. Central Fleet Vehicle Silhouette -->
  <g filter="url(#shadow)">
    <!-- Vehicle Body -->
    <path d="M12 39 L12 31.5 C12 29.5 13.5 28.5 15.5 28.5 L28 28.5 L35 20.5 C36.5 19 38.5 19 40.5 19 L48 19 C50.5 19 52 20.5 52 23 L52 37 C52 38.5 51 39 49.5 39 Z" fill="#ffffff"/>
    
    <!-- Windshield -->
    <path d="M30 28 L36 21 L47 21 L47 28 Z" fill="#581c87"/>

    <!-- Wheels -->
    <circle cx="21" cy="41" r="5" fill="#1e1b4b"/>
    <circle cx="21" cy="41" r="2.2" fill="#e2e8f0"/>
    <circle cx="43" cy="41" r="5" fill="#1e1b4b"/>
    <circle cx="43" cy="41" r="2.2" fill="#e2e8f0"/>

    <!-- Speed / Ground Line -->
    <rect x="10" y="44" width="44" height="2" rx="1" fill="#c084fc" opacity="0.6"/>
  </g>

  <!-- 4. High-voltage Lightning Bolt Symbol (PEA Electric) -->
  <path d="M30 14 L21 28 L27 28 L21 38 L33 25 L26 25 Z" fill="url(#peaGold)" filter="url(#shadow)"/>

  <!-- 5. Inspection Approved Checkmark Badge in Bottom Right -->
  <g transform="translate(37, 32)" filter="url(#shadow)">
    <circle cx="12" cy="12" r="11" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Checkmark Icon -->
    <path d="M7.5 12.5 L10.5 15.5 L16.5 8.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
